<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Utsuwa is an open-source AI companion with 3D VRM avatars, voice chat, semantic memory, and multi-provider LLM support. Self-hosted and privacy-first." />

		<link rel="icon" href="/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)" />
		<link rel="icon" href="/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)" />
		<script>
			(function() {
				// Marketing pages are light only. Mirrors isLightOnlyRoute in
				// src/lib/utils/light-only.ts; keep them in sync.
				const host = location.hostname;
				const path = location.pathname;
				if (!/^(docs|app)\./.test(host) && (path === '/' || /^\/(ja|blog|download|privacy|terms)(\/|$)/.test(path))) {
					document.documentElement.setAttribute('data-docs-theme', 'light');
					return;
				}
				const colorMode = localStorage.getItem('colorMode') || 'system';
				let shouldBeDark;
				if (colorMode === 'system') {
					shouldBeDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				} else {
					shouldBeDark = colorMode === 'dark';
				}
				if (shouldBeDark) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
